name: Update CompStat data

# The dashboard reads its feed from this repo, so if this job stops running the site
# quietly freezes. The scraper refuses to write when a workbook lags the citywide
# report, so a failed run means the NYPD changed something; read the log first.
#
# THIS JOB FEEDS TWO SOURCES ON TWO CLOCKS. The Excel workbooks land Monday midday
# and drive the Week and YTD views. The CompStat 2.0 timeline API drives the rolling
# 52-week series behind the DEFAULT Past-year view, and publishes the same week days
# later — Wednesday, as far as we can tell.
#
# WHY THIS IS NOT ON A WEEKLY CRON ANY MORE (2026-09-02). It used to fire on a guess
# about the NYPD's schedule. The guess was wrong in a way nobody could see: the slots
# caught the workbooks every week and the timeline API not once in a month, so the
# rolling series only ever advanced when a human ran it by hand. A fixed schedule also
# cannot survive a holiday, and the first Monday of September — the day the monthly
# email cycle keys off — is ALWAYS Labor Day.
#
# So it polls instead. scripts/probe_sources.py costs one HEAD, one 27KB GET and one
# API POST, cheap enough to run hourly, and the expensive pipeline runs only when a
# source actually has something we are not serving. The NYPD can publish whenever it
# likes; we notice within the hour without knowing its calendar. Every probe also
# records what each source had against what we served, which is what makes
# scripts/lag_report.py able to say how much delay WE are adding.
on:
  schedule:
    - cron: '17 * * * *'   # hourly, at :17 to avoid the top-of-hour stampede that makes
                           # GitHub's scheduler drop runs. Resolution, not precision: a
                           # delayed or skipped hour costs us minutes, not a cycle.
  workflow_dispatch:
    inputs:
      force:
        description: 'Type yes to run the full pipeline even if nothing changed'
        required: false
        default: ''
      test_alarm:
        description: 'Type yes to force a failure and test the alarm path'
        required: false
        default: ''

permissions:
  contents: write
  issues: write

concurrency:
  # Hourly runs must never overlap a long catch-up: two jobs writing data/ would race,
  # and the loser would push a half-updated feed.
  group: compstat-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Forced failure (alarm test only)
        if: inputs.test_alarm == 'yes'
        run: |
          echo "Deliberate failure to test the alarm path."
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Cheap. Always runs. Decides whether the rest of the job is worth doing, and
      # writes the observation the lag report is built from.
      - name: Ask both NYPD sources what they have
        id: probe
        run: python3 scripts/probe_sources.py --interval-hours 1

      - name: Scrape the weekly CompStat workbooks
        if: steps.probe.outputs.behind == '1' || inputs.force == 'yes'
        run: python3 scripts/scrape_compstat.py

      - name: Extend the weekly series and rebuild the 52-week rollup
        if: steps.probe.outputs.behind == '1' || inputs.force == 'yes'
        run: python3 scripts/archive_weekly_series.py

      - name: Rebuild the revision and volatility context
        if: steps.probe.outputs.behind == '1' || inputs.force == 'yes'
        run: python3 scripts/build_context.py

      # A second independent parse of the same workbooks is a free tripwire for a
      # changed file or column layout. It never blocks the update.
      - name: Cross-check against the upstream scraper
        if: steps.probe.outputs.behind == '1' || inputs.force == 'yes'
        continue-on-error: true
        run: python3 scripts/crosscheck_upstream.py

      # Re-probe after the pipeline so the ledger carries the moment we STARTED
      # serving the new week. Without this the catch-up is invisible until the next
      # hourly run and every lag measurement is rounded up by up to an hour.
      - name: Record what we now serve
        if: steps.probe.outputs.behind == '1' || inputs.force == 'yes'
        run: python3 scripts/probe_sources.py --interval-hours 1

      - name: Commit whatever changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "CompStat update ($(date -u +'%Y-%m-%d %H:%MZ'))"
            git pull --rebase --autostash
            git push
          fi

      - name: Fail if we are behind the NYPD
        run: python3 scripts/check_freshness.py

      # An hourly job must never open an issue an hour. Both notices below are
      # deduplicated against the open issues already on the repo.
      - name: Notice when the NYPD itself has gone quiet
        if: steps.probe.outputs.late == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="NOTICE: NYPD has published nothing since ${{ steps.probe.outputs.newest }}"
          if gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title NOTICE NYPD" \
               --json title -q '.[].title' | grep -qxF "$TITLE"; then
            echo "Already noticed; not filing again."
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body "$(cat <<BODY
          @tedalcorn Not a failure and nothing to fix here — the pipeline is healthy and
          in sync. The NYPD simply has not posted a new week since ${{ steps.probe.outputs.newest }},
          which is longer than a holiday would explain.

          Worth a look at https://compstat.nypdonline.org and the workbook URLs in
          scripts/scrape_compstat.py in case something moved upstream.

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          BODY
          )" || true
          fi

      - name: File an alarm issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="ALARM: CompStat update failed"
          if gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title ALARM CompStat update failed" \
               --json title -q '.[].title' | grep -qxF "$TITLE"; then
            echo "An alarm is already open; not filing a duplicate."
            exit 0
          fi
          gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body "$(cat <<BODY
          @tedalcorn The CompStat update failed. Until this is fixed the site serves
          whatever it last committed.

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          This job runs hourly, so it keeps retrying on its own and this issue will NOT be
          refiled every hour. Close it once fixed; a still-broken pipeline opens a new one
          on the next failure after that.

          Read the log for which step failed.

          BEHIND THE NYPD — the data exists upstream and we are not serving it. Ours to
          fix, and waiting does not help.

          A scrape or archive step — a retired workbook URL after a command
          reorganization (fix the file list in scripts/scrape_compstat.py), or a changed
          workbook layout.

          A LATE NYPD no longer reaches this path at all: it files a NOTICE issue instead,
          because a holiday is not a pipeline failure.
          BODY
          )" || true
