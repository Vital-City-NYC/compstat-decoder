name: Update CompStat data

# The dashboard reads its feed from this repo, so if this job stops running the site
# quietly freezes — the same failure mode as reading a retired workbook. The scraper
# refuses to write when a workbook lags the citywide report, so a failed run means the
# NYPD changed something; read the log before overriding it.
on:
  schedule:
    - cron: '0 18 * * 1'   # Mondays 2pm ET / 1pm EST. The NYPD posted at ~12:45 ET on
                           # 2026-08-17 and the old noon slot missed it, so the digest an
                           # hour later would have been built on the previous week.
    - cron: '0 14 * * 2'   # Tuesday retry, 10am ET — deliberately TWO HOURS BEFORE the
                           # send job, which runs at 16:00 UTC. They used to share the
                           # 16:00 slot, so a retry could rewrite data/ while the send
                           # was rendering from it.
  workflow_dispatch:
    inputs:
      test_alarm:
        description: 'Type yes to force a failure and test the alarm path'
        required: false
        default: ''

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Forced failure (alarm test only)
        if: inputs.test_alarm == 'yes'
        run: |
          echo "Deliberate failure to test the alarm path."
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape the weekly CompStat workbooks
        run: python3 scripts/scrape_compstat.py

      - name: Extend the weekly series and rebuild the 52-week rollup
        run: python3 scripts/archive_weekly_series.py

      - name: Rebuild the revision and volatility context
        run: python3 scripts/build_context.py

      # Nothing depends on the upstream scraper any more, but a second independent parse of
      # the same NYPD workbooks is a free tripwire for a changed file or column layout. It
      # never blocks the update — if it reports drift, check the log and decide.
      - name: Cross-check against the upstream scraper
        continue-on-error: true
        run: python3 scripts/crosscheck_upstream.py

      - name: Commit whatever changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No change — the NYPD has not posted a new report."
          else
            git commit -m "Weekly CompStat update ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Fail if the feed is stale (NYPD posted nothing new)
        # LAST on purpose, and the ordering is load-bearing twice over.
        #
        # It reads the committed rolling.json, so run before the archiver it grades the
        # PREVIOUS week's run rather than this one — and since it aborts the job, the
        # archiver never reached the gap it was complaining about. That deadlocked the
        # pipeline on 2026-08-31: the rolling feed stalled at 8/16 while the workbooks
        # reached 8/30, and the Tuesday retry could only fail the same way, forever.
        #
        # It also sits after the commit so a red run still BANKS its progress. If the
        # API is mid-catch-up the partial advance is worth keeping; failing first would
        # throw it away and refetch the same weeks next time. The run still goes red and
        # still files the alarm issue, which is the part that has to work.
        run: python3 scripts/check_freshness.py

      - name: File an alarm issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" \
            --title "ALARM: CompStat update failed $(date -u +%Y-%m-%d)" \
            --body "@tedalcorn The scheduled CompStat update failed. Until this is fixed the site serves last week's data (its own stale notices will appear after ~8 days).

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Read the log to see WHICH guard tripped — the two failures need opposite responses.

          STALE FEED (workbook age): the NYPD posted late. The Tuesday retry usually heals this on its own; check tomorrow before acting.

          ROLLING FEED BEHIND: the workbooks are fine and the timeline API at compstat.nypdonline.org is the one lagging. It normally trails by about a week and catches up on its own, so a single red run here is not yet an emergency — but if it repeats a second week the API has missed a full cycle and the Past-year view (the site DEFAULT) is serving a stale window. Waiting does not fix that one.

          Other causes: a retired workbook URL after a command reorganization (fix the file list in scripts/scrape_compstat.py); a changed workbook layout (read the run log)." || true
