name: Send district emails

# The send half of the email cycle. Runs Tuesday AND Wednesday at noon ET; the gate
# lets it through only on the day AFTER the pre-flight digest was actually mailed
# (Tuesday in a normal month, Wednesday when a holiday Monday slid the cycle), and
# only if the data still ends on the week the reviewers saw. An open issue titled
# HOLD stops it. Manual dispatch runs any time (used for beta cycles) and skips the
# pre-flight handshake.

on:
  schedule:
    - cron: '0 16 * * 2,3'   # Tue + Wed noon ET; the gate picks the live day
  workflow_dispatch:
    inputs:
      cadence:
        description: 'monthly or quarterly'
        default: 'monthly'

permissions:
  contents: read
  issues: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Only the day after a digest was mailed (scheduled runs)
        if: github.event_name == 'schedule'
        run: |
          python3 scripts/cycle_gate.py send | tee -a "$GITHUB_ENV"
          echo "GUARD=--require-preflight" >> "$GITHUB_ENV"

      - name: Manual runs always proceed
        if: github.event_name != 'schedule'
        run: echo "ACTION=run" >> "$GITHUB_ENV"

      - name: Nothing to do today
        if: env.ACTION != 'run'
        run: echo "Skip — $WHY"

      - name: Send the monthly cycle
        if: env.ACTION == 'run'
        env:
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
        run: python3 scripts/send_cycle.py --cadence ${{ inputs.cadence || 'monthly' }} $GUARD

      - name: Also the quarterly cycle, in quarter months
        if: env.ACTION == 'run' && github.event_name == 'schedule'
        env:
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
        run: |
          M=$(TZ=America/New_York date +%m)
          case "$M" in 01|04|07|10) python3 scripts/send_cycle.py --cadence quarterly $GUARD ;; *) echo "not a quarter month" ;; esac

      - name: File an alarm issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" \
            --title "ALARM: district email send failed $(date -u +%Y-%m-%d)" \
            --body "@tedalcorn The send job failed — subscribers may have received some, all, or none of this cycle. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
